# Local development database: a single-node MongoDB replica set (transactions need a replica set).
# Start: pnpm db:up   → connection string: mongodb://localhost:27017/jfa?replicaSet=rs0
services:
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mongo-data:
