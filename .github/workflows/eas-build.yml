name: Mobile APK (EAS)

# Builds a shareable APK (internal distribution) — manually or by pushing a tag `mobile-v0.x.y`.
# For JS-only changes prefer an OTA update: `pnpm --filter @jfa/mobile update:preview`.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@jfa/mobile^..." build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS build (runs on Expo's servers; link appears in the Expo dashboard)
        working-directory: apps/mobile
        run: eas build -p android --profile ${{ inputs.profile || 'preview' }} --non-interactive --no-wait
