<?xml version="1.0" encoding="UTF-8"?>
<!--
  Justice For All — "Open Law" mark (app icon). Original artwork, drawn from geometric primitives.
  Concept: an open book (law made readable) whose spine rises into a balance (fairness),
  topped by a point of light (hope / the person seeking help).
  Palette: cyan #67E8F9 → violet #A78BFA tile, ink #0B0D17 mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>

  <g fill="none" stroke="#0B0D17" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- point of light -->
    <circle cx="512" cy="236" r="40" fill="#0B0D17" stroke="none"/>
    <!-- stem rising from the book's spine -->
    <path d="M512 322 V 690"/>
    <!-- arched beam (open arms) -->
    <path d="M286 392 Q 512 336 738 392"/>
    <!-- left pan -->
    <path d="M286 392 L 222 548"/>
    <path d="M286 392 L 350 548"/>
    <path d="M200 548 Q 286 626 372 548 Z" fill="#0B0D17"/>
    <!-- right pan -->
    <path d="M738 392 L 674 548"/>
    <path d="M738 392 L 802 548"/>
    <path d="M652 548 Q 738 626 824 548 Z" fill="#0B0D17"/>
  </g>

  <!-- open book: two leaves meeting at the spine -->
  <path d="M500 724 C 430 682 338 674 240 700 L 240 820 C 338 796 430 802 500 846 Z" fill="#0B0D17"/>
  <path d="M524 724 C 594 682 686 674 784 700 L 784 820 C 686 796 594 802 524 846 Z" fill="#0B0D17"/>
  <!-- page lines -->
  <g fill="none" stroke="url(#tile)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M300 742 C 360 730 420 734 468 756"/>
    <path d="M724 742 C 664 730 604 734 556 756"/>
  </g>
</svg>
